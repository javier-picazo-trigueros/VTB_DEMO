server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API, en el mismo origen que la página, como hace el rewrite de Vercel
    # (frontend/vercel.json): en producción el frontend llama siempre a /backend.
    # Con la barra final en proxy_pass, /backend/auth/login llega al backend como
    # /auth/login. Mismo origen = las cookies de sesión son de primer origen.
    location /backend/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # El backend admite subidas de hasta 2 MB (imágenes y CSV).
        client_max_body_size 3m;
    }

    # Los ficheros de /assets llevan el hash en el nombre: se pueden cachear siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El HTML nunca se cachea: es lo que apunta a los ficheros con hash.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Salud del propio nginx (la del backend es /backend/health).
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Aplicación de una sola página: cualquier ruta del cliente devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
