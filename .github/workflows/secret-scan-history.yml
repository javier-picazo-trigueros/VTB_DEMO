name: Secret scan (historial completo)

# El job "Secret scan" de ci.yml solo mira el diff contra la rama base en
# cada push/PR — es rápido, pero no vuelve a mirar commits ya fusionados.
# Así fue como la clave de Alchemy filtrada en frontend/.env.production
# (commit dfc78c5a) pasó desapercibida durante varios commits: cada PR
# individual estaba limpio, el historial acumulado no lo estaba.
#
# Este workflow escanea TODO el historial de la rama por defecto una vez
# por semana, más bajo demanda. base: "" es intencional — es lo que le dice
# a la Action que ignore el rango diff/PR y recorra el historial completo
# en vez de compararlo contra un punto de partida.

on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch: {}

jobs:
  secret-scan-history:
    name: TruffleHog — historial completo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog necesita el historial completo

      - name: TruffleHog OSS — full history
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified
